# Stablecoin registry for the attestation-analysis agent.
#
# VERIFY EVERY ADDRESS before trusting it. A wrong contract address silently
# returns a wrong supply number — unacceptable for a compliance tool.
# `verified: true` means a human checked it (via `sca curate`). Unverified
# addresses are used but loudly flagged.
#
# transparency_url is the DURABLE anchor — the attestation locator resolves
# the current PDF from it, so a changed PDF URL never blindsides us.
# latest_attestation_url is an optional seed / cache hint and may rot.
#
# Scope: fiat-backed stablecoins that publish reserve attestations.
# Crypto-collateralised tokens (DAI/USDS, GHO, crvUSD) and synthetics (USDe)
# are out of v1 — their backing is on-chain collateral, not a PDF attestation.

chains:
  # Each chain lists multiple endpoints — primary first, then fallbacks.
  # High-stakes reads (totalSupply) are corroborated across endpoints so a
  # single misbehaving RPC can't quietly poison a "fully backed" judgement.
  # Decimals reads (immutable) use primary only.
  # Env override: `<CHAIN>_RPCS=url1,url2,url3` or legacy `<CHAIN>_RPC_URL`.
  ethereum:
    kind: evm
    rpcs:
      - "https://ethereum-rpc.publicnode.com"
      - "https://cloudflare-eth.com"
  base:
    kind: evm
    rpcs:
      - "https://base-rpc.publicnode.com"
      - "https://mainnet.base.org"
  arbitrum:
    kind: evm
    rpcs:
      - "https://arbitrum-one-rpc.publicnode.com"
      - "https://arb1.arbitrum.io/rpc"
  optimism:
    kind: evm
    rpcs:
      - "https://optimism-rpc.publicnode.com"
      - "https://mainnet.optimism.io"
  polygon:
    kind: evm
    rpcs:
      - "https://polygon-bor-rpc.publicnode.com"
      - "https://polygon-rpc.com"
  bsc:
    kind: evm
    rpcs:
      - "https://bsc-rpc.publicnode.com"
      - "https://bsc-dataseed.binance.org"
  avalanche:
    kind: evm
    rpcs:
      - "https://avalanche-c-chain-rpc.publicnode.com"
      - "https://api.avax.network/ext/bc/C/rpc"
  solana:
    kind: solana
    rpcs:
      - "https://api.mainnet-beta.solana.com"
      - "https://solana-rpc.publicnode.com"
  tron:
    kind: tron
    rpcs:
      - "https://api.trongrid.io"

