# Stablecoin registry for the attestation-analysis agent.
#
# VERIFY EVERY ADDRESS before trusting it. A wrong contract address silently
# returns a wrong supply number — unacceptable for a compliance tool.
# `verified: true` means a human checked it (via `sca curate`). Unverified
# addresses are used but loudly flagged.
#
# transparency_url is the DURABLE anchor — the attestation locator resolves
# the current PDF from it, so a changed PDF URL never blindsides us.
# latest_attestation_url is an optional seed / cache hint and may rot.
#
# Scope: fiat-backed stablecoins that publish reserve attestations.
# Crypto-collateralised tokens (DAI/USDS, GHO, crvUSD) and synthetics (USDe)
# are out of v1 — their backing is on-chain collateral, not a PDF attestation.

chains:
  ethereum: {kind: evm, rpc: "https://ethereum-rpc.publicnode.com"}
  base: {kind: evm, rpc: "https://base-rpc.publicnode.com"}
  arbitrum: {kind: evm, rpc: "https://arbitrum-one-rpc.publicnode.com"}
  optimism: {kind: evm, rpc: "https://optimism-rpc.publicnode.com"}
  polygon: {kind: evm, rpc: "https://polygon-bor-rpc.publicnode.com"}
  solana: {kind: solana, rpc: "https://api.mainnet-beta.solana.com"}
  tron: {kind: tron, rpc: "https://api.trongrid.io"}

